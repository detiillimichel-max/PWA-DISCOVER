name: DISCOVER • Atualizar catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: discover-catalog-refresh
  cancel-in-progress: true

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Atualizar catálogo
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/catalog_pipeline.py

      - name: Publicar catálogo e estado de proteção
        run: |
          if git diff --quiet -- catalog/discover.json catalog/.api-usage.json; then
            echo "Nenhuma alteração no catálogo ou no estado de proteção."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/discover.json catalog/.api-usage.json
          git commit -m "chore: refresh DISCOVER catalog and API guard"
          git push
