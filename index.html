<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="DISCOVER — catálogo visual de imagens, cultura, história e experiências 360°.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.css">
  <link rel="stylesheet" href="style.css?v=6">
  <title>DISCOVER</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">PWA • MODO CINEMA</p>
      <h1>DISCOVER <span>🌎</span></h1>
      <p class="subtitle">Descubra imagens, cultura, história e experiências visuais.</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="search-card" aria-label="Busca">
      <label for="search">O que você quer descobrir?</label>
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Ex.: Marte, museu, Egito..." autocomplete="off">
      </div>
      <p id="catalog-status" class="status">Catálogo local carregando…</p>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <p class="eyebrow">CATÁLOGO</p>
          <h2>Descobertas</h2>
        </div>
        <span id="result-count" class="count">0 itens</span>
      </div>
      <div id="discover-grid" class="discover-grid" aria-live="polite"></div>
    </section>
  </main>

  <div id="viewer-modal" class="viewer-modal" aria-hidden="true">
    <div class="viewer-header">
      <div>
        <p id="viewer-eyebrow" class="eyebrow">EXPERIÊNCIA 360°</p>
        <h2 id="viewer-title">Panorama</h2>
      </div>
      <button id="viewer-close" class="viewer-close" type="button" aria-label="Fechar visualizador">×</button>
    </div>
    <div id="viewer" class="viewer" aria-label="Visualizador de panorama 360 graus"></div>
    <div id="viewer-info" class="viewer-info"></div>
  </div>

  <footer>
    <span>DISCOVER V1 • Fundação</span>
    <span>Catálogo local • sem APIs na abertura</span>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.js",
        "@photo-sphere-viewer/gyroscope-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin@5.15.1/index.module.js"
      }
    }
  </script>
  <script type="module" src="viewer.js?v=6"></script>
  <script src="app.js?v=6" defer></script>
</body>
</html>
